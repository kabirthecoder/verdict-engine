[project]
name = "verdict-engine"
version = "0.1.0"
description = "Adversarial evidence court: multi-agent decisions that can be audited, attacked and defended."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kabir Mehta", email = "kabirmehtakabir@gmail.com" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
verdict = "verdict.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
